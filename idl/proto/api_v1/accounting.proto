syntax = "proto3";

package erp.api_v1;

import public "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "common.proto";

option go_package = "/proto";
// option go_package = "/api_v1";


message Tes {
    string t = 1;
}

message TransactionLedger {
    int32 ledger_no =1;
    int32 ledger_no_de =2;
    int32 amount = 3;
    google.protobuf.Timestamp datetime = 4;
    Result result = 5;
}




service TransactionService {
    rpc SaveTransaction(TransactionLedger) returns (google.protobuf.Empty);
}