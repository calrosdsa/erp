# NATS JetStream Configuration for ERP Development Environment

# Basic server configuration
server_name: erp-nats-dev
host: 0.0.0.0
port: 4222

# Enable JetStream
jetstream {
    # Store directory
    store_dir: "/data"
    
    # Maximum memory usage
    max_memory_store: 256MB
    
    # Maximum file usage
    max_file_store: 2GB
}

# Enable monitoring
http_port: 8222

# Clustering (for future scale)
cluster {
    name: erp-cluster
    host: 0.0.0.0
    port: 6222
}

# Logging
log_file: "/data/nats.log"
logtime: true
debug: true
trace: false

# Limits
max_connections: 64K
max_control_line: 4KB
max_payload: 8MB
max_pending: 256MB

# Authentication (development only - use proper auth in production)
# For development, we'll use no authentication
# In production, use proper JWT or token authentication

# Performance tuning
write_deadline: "10s"
max_closed_clients: 500
ping_interval: "2m"
ping_max: 2

